name: Sidecar Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check
      - name: Lint
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo +1.88.0 test --locked --all-targets
